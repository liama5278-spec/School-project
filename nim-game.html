<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game of Nim — Vs. Clanker Bot</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --p1: #2563eb;
      --p2: #db2777;
      --bot: #475569;
      --bean: #92400e;
      --bean-highlight: #b45309;
      --poison: #dc2626;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 540px;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.8rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .section-label {
      text-align: left;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    /* Setup Screen */
    .option-group {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .option-row {
      display: flex;
      gap: 0.65rem;
    }

    .option-row .mode-card {
      flex: 1;
    }

    .mode-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .mode-card:hover {
      border-color: #cbd5e1;
    }

    .mode-card.selected {
      border-color: var(--p1);
      background-color: #eff6ff;
    }

    .mode-card input {
      margin-top: 0.25rem;
    }

    .mode-title {
      font-weight: 700;
      display: block;
      margin-bottom: 0.15rem;
      font-size: 0.95rem;
    }

    .mode-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.3;
    }

    /* Game Screen */
    .hidden {
      display: none !important;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .badge {
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: #e2e8f0;
    }

    .turn-banner {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      padding: 0.65rem;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
    }

    .p1-turn {
      background: #dbeafe;
      color: var(--p1);
    }

    .p2-turn {
      background: #fce7f3;
      color: var(--p2);
    }

    .bot-turn {
      background: #e2e8f0;
      color: #1e293b;
      font-family: "Courier New", Courier, monospace;
    }

    .winner-banner {
      background: #dcfce7;
      color: #15803d;
    }

    .loser-banner {
      background: #fee2e2;
      color: #b91c1c;
    }

    .bot-chatter {
      background: #1e293b;
      color: #38bdf8;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.88rem;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: left;
      min-height: 2.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pile-area {
      background: #fafaf9;
      border: 2px dashed #d6d3d1;
      border-radius: 12px;
      padding: 1.25rem;
      min-height: 130px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.25rem;
    }

    .bean {
      width: 28px;
      height: 18px;
      background: radial-gradient(circle at 30% 30%, var(--bean-highlight), var(--bean));
      border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .bean.poison {
      background: radial-gradient(circle at 30% 30%, #f87171, var(--poison));
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.5);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--p1);
      color: white;
      width: 100%;
    }

    .btn-take {
      background: var(--text);
      color: white;
      flex: 1;
    }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
    }

    .history {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Game of Nim</h1>
    <p class="subtitle">20 Beans &bull; Take 1, 2, or 3 per turn</p>

    <!-- SETUP VIEW -->
    <div id="setup-view">
      <div class="section-label">1. Choose Opponent</div>
      <div class="option-group">
        <label class="mode-card selected" id="card-bot">
          <input type="radio" name="opponent" value="bot" checked />
          <div>
            <span class="mode-title">🤖 1-Player vs. Clanker Bot</span>
            <span class="mode-desc">Face off against a rusty, math-crunching tin can.</span>
          </div>
        </label>

        <label class="mode-card" id="card-pvp">
          <input type="radio" name="opponent" value="pvp" />
          <div>
            <span class="mode-title">👥 2-Player Local</span>
            <span class="mode-desc">Pass and play with a human friend.</span>
          </div>
        </label>
      </div>

      <!-- Turn Order Option (Only visible for Bot mode) -->
      <div id="turn-order-section">
        <div class="section-label">2. Who Goes First?</div>
        <div class="option-group option-row">
          <label class="mode-card selected" id="card-first-human">
            <input type="radio" name="firstturn" value="human" checked />
            <div>
              <span class="mode-title">You First</span>
              <span class="mode-desc">Make the opening move.</span>
            </div>
          </label>

          <label class="mode-card" id="card-first-bot">
            <input type="radio" name="firstturn" value="bot" />
            <div>
              <span class="mode-title">Clanker First</span>
              <span class="mode-desc">Let the rust-bucket start.</span>
            </div>
          </label>
        </div>
      </div>

      <div class="section-label">3. Objective</div>
      <div class="option-group">
        <label class="mode-card selected" id="card-normal">
          <input type="radio" name="gamemode" value="normal" checked />
          <div>
            <span class="mode-title">Normal Play</span>
            <span class="mode-desc">The player who takes the <strong>last bean wins</strong>.</span>
          </div>
        </label>

        <label class="mode-card" id="card-misere">
          <input type="radio" name="gamemode" value="misere" />
          <div>
            <span class="mode-title">Misère (Poison Bean)</span>
            <span class="mode-desc">The player forced to take the <strong>last bean loses</strong>.</span>
          </div>
        </label>
      </div>

      <button class="btn-primary" id="start-btn">Start Game</button>
    </div>

    <!-- GAME VIEW -->
    <div id="game-view" class="hidden">
      <div class="status-bar">
        <span>Beans left: <strong id="bean-count">20</strong></span>
        <span class="badge" id="mode-badge">Normal Mode</span>
      </div>

      <div class="turn-banner p1-turn" id="turn-banner">Your Turn</div>

      <div class="bot-chatter hidden" id="bot-chatter">
        <span>🤖:</span>
        <span id="bot-quote">BZZT. Preparing to harvest beans, meatbag.</span>
      </div>

      <div class="pile-area" id="pile-area" aria-label="Pile of beans"></div>

      <div class="controls" id="take-controls">
        <button class="btn-take" data-take="1">Take 1</button>
        <button class="btn-take" data-take="2">Take 2</button>
        <button class="btn-take" data-take="3">Take 3</button>
      </div>

      <div class="history" id="last-move">Game started with 20 beans.</div>

      <button class="btn-secondary" id="reset-btn">Change Settings / Restart</button>
    </div>
  </div>

  <script>
    const TOTAL_BEANS = 20;
    let beansRemaining = TOTAL_BEANS;
    let currentPlayer = 1; // 1 = Human / P1, 2 = Clanker Bot / P2
    let opponentType = "bot"; // "bot" or "pvp"
    let firstTurn = "human"; // "human" or "bot"
    let gameMode = "normal"; // "normal" or "misere"
    let gameOver = false;
    let botThinking = false;
    let botTimer = null;

    // Clanker Voice Lines
    const QUOTES = {
      start: [
        "BZZT. Calculating optimal bean-stealing subroutines...",
        "CLANK! My rusty gears are ready to crush you, meatbag.",
        "01000010 01000101 01000001 01001110 01010011. Let's play."
      ],
